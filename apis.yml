aid: aegfuels
name: AEG Fuels
description: >-
  AEG Fuels (Associated Energy Group, LLC) is a Miami, Florida-based global aviation
  fuel supply, logistics and trip-support company that has served commercial air carriers,
  business and general aviation operators, FBOs and government aircraft since 1988. It
  arranges jet fuel uplifts at more than 3,000 locations across 197 countries and layers
  ancillary services on top of supply: flight support (flight planning, ground handling,
  overflight and landing permits, on-site supervision, coordination of third-party
  services), fuel management for airlines, tax recovery and VAT exemption, a Sustainable
  Aviation Fuel (SAF) program, marine fuel and land fuel, the Carnet fuel card, the AEG
  Rewards loyalty program, and the AEG Connect network for FBOs and bulk fuel
  distribution. Customers transact through the company's own MILO ordering platform - a
  browser client portal at app.aegfuels.com and iOS/Android apps for quoting, ordering,
  authorizing and reviewing fuel transactions. As of this profile AEG Fuels publishes no
  public developer program, API reference or machine-readable contract; the digital
  surface is an end-user product, not a platform.
